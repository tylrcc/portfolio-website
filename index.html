<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Tyler Riccardi - creative portfolio styled as a Mac OS 9 desktop." />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preload" href="/apple-logo.svg" as="image" type="image/svg+xml" fetchpriority="high" />
    <style>
      body {
        margin: 0;
        background: #000;
      }

      .boot-shell {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #000;
        color: #fff;
        font-family: Geneva, 'Lucida Grande', system-ui, sans-serif;
        text-align: center;
      }

      .boot-shell img {
        width: 72px;
        height: 72px;
        margin-bottom: 14px;
      }

      .boot-shell h2 {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 400;
      }

      .boot-shell p {
        margin: 20px 0 0;
        color: #aaa;
      }
    </style>
    <title>ty riccardi</title>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell" aria-hidden="true">
        <img src="/apple-logo.svg" alt="" width="72" height="72" fetchpriority="high" decoding="async" />
        <h2>Welcome to Mac OS.</h2>
        <p>(Click or tap anywhere to Startup)</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
